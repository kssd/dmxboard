os: linux
dist: jammy
language: python
python:
  - "3.11"

cache:
  directories:
    - ~/.platformio/.cache

install:
  - pip install platformio

script:
  - c++ -std=c++11 -Itest/host/include -Ilib/DMXDriver/src test/host/test_dmx_driver.cpp lib/DMXDriver/src/DMXDriver.cpp -o /tmp/dmx-driver-tests
  - /tmp/dmx-driver-tests
  - pio run -e megaatmega2560
